<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮悦设计事务所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
nav{background:#fff;box-shadow:0 2px 6px #00000015;position:sticky;top:0;z-index:99}
.nav-wrap{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:#2563eb}
.nav-wrap a{margin-left:20px;text-decoration:none;color:#333}
.nav-wrap a:hover{color:#2563eb}
.banner{height:460px;background:#222;display:flex;align-items:center;padding-left:10%;color:#fff;background-size:cover;background-position:center}
.banner h2{font-size:40px;margin-bottom:12px}
.banner p{font-size:17px;margin-bottom:20px}
.btn{background:#2563eb;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-block}
.container{max-width:1200px;margin:0 auto;padding:60px 20px}
.title{text-align:center;font-size:26px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #00000010}
.card img{width:100%;height:190px;object-fit:cover}
.card-body{padding:16px}
.card-body h4{font-size:18px;margin-bottom:6px}
.card-body p{color:#666;font-size:14px}
.price{color:#c82423;font-weight:bold;font-size:20px;margin:8px 0}
footer{background:#1f2937;color:#fff;text-align:center;padding:30px 0;margin-top:40px}
</style>
</head>
<body>
<nav>
  <div class="nav-wrap">
    <div class="logo" id="logoTxt">潮悦设计事务所</div>
    <div>
      <a href="#home">首页</a>
      <a href="#about">关于我们</a>
      <a href="#case">装修案例</a>
      <a href="#pkg">整装套餐</a>
      <a href="#contact">联系我们</a>
    </div>
  </div>
</nav>

<section class="banner" id="home" id="bannerWrap">
  <div>
    <h2 id="bannerTitle">匠心整装，品质家装</h2>
    <p id="bannerSub">一站式家装服务</p>
    <a href="#contact" class="btn">免费预约</a>
  </div>
</section>

<section class="container" id="about">
  <h2 class="title">关于我们</h2>
  <p style="text-align:center;font-size:16px;max-width:800px;margin:0 auto" id="descTxt"></p>
</section>

<section class="container" id="case">
  <h2 class="title">装修案例</h2>
  <div class="grid" id="caseWrap"></div>
</section>

<section class="container" id="pkg">
  <h2 class="title">整装套餐</h2>
  <div class="grid" id="pkgWrap"></div>
</section>

<section class="container" id="contact">
  <h2 class="title">联系我们</h2>
  <p style="text-align:center;font-size:22px">📞 <span id="phoneTxt"></span></p>
</section>

<footer>
  <p id="footerTxt"></p>
</footer>

<script>
async function load(){
  let cfg;
  try{
    const res = await fetch("./config.json");
    cfg = await res.json();
  }catch(e){
    cfg = {
      siteName:"潮悦设计事务所",
      sitePhone:"17773404898",
      siteDesc:"专注家装、旧房改造、全屋整装，设计施工一体化，透明装修",
      banner:[{"title":"匠心整装，品质家装","img":""}],
      caseList:[{"title":"现代简约三房","desc":"120㎡现代简约","img":""}],
      packageList:[{"title":"刚需整装套餐","price":"1088元/㎡","desc":"基础硬装、水电、墙地砖"}]
    }
  }
  document.getElementById("logoTxt").innerText = cfg.siteName;
  document.getElementById("bannerTitle").innerText = cfg.banner[0].title;
  document.getElementById("descTxt").innerText = cfg.siteDesc;
  document.getElementById("phoneTxt").innerText = cfg.sitePhone;
  document.getElementById("footerTxt").innerText = cfg.siteName + " ©版权所有";
  if(cfg.banner[0].img) document.querySelector('.banner').style.backgroundImage=`url(${cfg.banner[0].img})`

  const caseWrap = document.getElementById('caseWrap');
  cfg.caseList.forEach(item=>{
    caseWrap.innerHTML += `
    <div class="card">
      <img src="${item.img||'https://picsum.photos/id/1048/600/400'}">
      <div class="card-body">
        <h4>${item.title}</h4>
        <p>${item.desc}</p>
      </div>
    </div>`
  })
  const pkgWrap = document.getElementById('pkgWrap');
  cfg.packageList.forEach(item=>{
    pkgWrap.innerHTML += `
    <div class="card">
      <div class="card-body">
        <h4>${item.title}</h4>
        <div class="price">${item.price}</div>
        <p>${item.desc}</p>
      </div>
    </div>`
  })
}
load();
</script>
</body>
</html>
