<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璟象装饰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{color:#333}
header{background:#222;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.banner{width:100%;height:320px;display:flex;overflow:hidden}
.banner-item{flex:0 0 100%;height:100%;background-size:cover;background-position:center;display:flex;align-items:center;padding-left:60px;color:#fff;font-size:32px;font-weight:bold}
section{max-width:1200px;margin:40px auto;padding:0 20px}
h2{margin-bottom:20px;color:#222}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{border:1px solid #eee;border-radius:10px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card .info{padding:12px}
footer{background:#222;color:#fff;text-align:center;padding:24px;margin-top:40px}
</style>
</head>
<body>
<header>
  <div id="siteTitle">璟象装饰</div>
  <div id="sitePhone">13800000000</div>
</header>
<div class="banner" id="bannerWrap"></div>

<section>
  <h2>装修案例</h2>
  <div class="grid" id="caseWrap"></div>
</section>

<section>
  <h2>整装套餐</h2>
  <div class="grid" id="packageWrap"></div>
</section>

<footer>© <span id="footerName"></span> 装修公司</footer>

<script>
const API = "https://zhuangxiu-api.2653709704.workers.dev";
let cfg = {};
async function init(){
  const res = await fetch(`${API}/getConfig`);
  cfg = await res.json();
  document.getElementById("siteTitle").innerText = cfg.siteName;
  document.getElementById("sitePhone").innerText = cfg.phone;
  document.getElementById("footerName").innerText = cfg.siteName;

  // 轮播
  const bannerWrap = document.getElementById("bannerWrap");
  bannerWrap.innerHTML = cfg.banner.map(item=>`
    <div class="banner-item" style="background-image:url(${item.img})">${item.title}</div>
  `).join("");

  // 案例
  const caseWrap = document.getElementById("caseWrap");
  caseWrap.innerHTML = cfg.caseList.map(item=>`
    <div class="card">
      <img src="${item.img}" alt="${item.title}">
      <div class="info">
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      </div>
    </div>
  `).join("");

  // 套餐
  const packageWrap = document.getElementById("packageWrap");
  packageWrap.innerHTML = cfg.packageList.map(item=>`
    <div class="card">
      <div class="info">
        <h3>${item.title}</h3>
        <p>价格：${item.price}</p>
      </div>
    </div>
  `).join("");
}
init();
</script>
</body>
</html>
