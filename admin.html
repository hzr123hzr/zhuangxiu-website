<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璟象装饰｜后台管理</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:20px auto;padding:0 20px;background:#f5f7fa}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
input,textarea,button{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:15px}
button{background:#2563eb;color:#fff;border:none;cursor:pointer;font-weight:bold}
button.danger{background:#dc2626}
.upload-box{border:2px dashed #ccc;padding:20px;text-align:center;border-radius:8px}
.preview-img{max-width:240px;margin:10px 0}
.hidden{display:none}
.group{display:flex;gap:10px}
.group button{flex:1}
</style>
</head>
<body>
<div id="loginBox" class="card">
  <h3>🔐 后台登录</h3>
  <input type="password" id="pwdInput" placeholder="输入管理密码">
  <button onclick="login()">登录后台</button>
</div>

<div id="mainBox" class="hidden">
  <div class="card">
    <h3>📷 图片上传（自动生成链接）</h3>
    <div class="upload-box">
      <input type="file" id="imgFile" accept="image/*">
      <button onclick="uploadImage()">上传图片</button>
    </div>
    <p>图片链接：<input id="imgLinkOut" readonly></p>
    <img class="preview-img" id="imgPreview">
  </div>

  <div class="card">
    <h3>🏢 基础信息</h3>
    <label>公司名称</label>
    <input id="siteName">
    <label>联系电话</label>
    <input id="sitePhone">
    <button onclick="saveConfig()">保存全部修改</button>
  </div>

  <div class="card">
    <h3>🏞️ 轮播Banner（JSON格式）</h3>
    <textarea id="bannerArea" rows="6"></textarea>
  </div>

  <div class="card">
    <h3>📋 装修案例</h3>
    <textarea id="caseArea" rows="6"></textarea>
  </div>

  <div class="card">
    <h3>📦 套餐内容</h3>
    <textarea id="packageArea" rows="6"></textarea>
  </div>

  <div class="group">
    <button onclick="loadConfig()">刷新数据</button>
    <button class="danger" onclick="logout()">退出登录</button>
  </div>
</div>

<script>
const API = "https://zhuangxiu-api.2653709704.workers.dev";
let token = localStorage.getItem("adminToken");

(async function(){
  if(token){
    await loadConfig();
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("mainBox").classList.remove("hidden");
  }
})()

async function login(){
  const pwd = document.getElementById("pwdInput").value.trim();
  const res = await fetch(`${API}/login`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:pwd})
  })
  const json = await res.json();
  if(json.ok){
    token = json.token;
    localStorage.setItem("adminToken",token);
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("mainBox").classList.remove("hidden");
    await loadConfig();
    alert("✅登录成功！");
  }else{
    alert("密码错误！");
  }
}

async function uploadImage(){
  const file = document.getElementById("imgFile").files[0];
  if(!file) return alert("先选择图片");
  if(file.size>200*1024) return alert("图片不能超过200KB！");
  const fd = new FormData();
  fd.append("img",file);
  const res = await fetch(`${API}/uploadImg`,{
    method:"POST",
    headers:{"Authorization":`Bearer ${token}`},
    body:fd
  })
  const json = await res.json();
  if(json.ok){
    document.getElementById("imgLinkOut").value = json.imgUrl;
    document.getElementById("imgPreview").src = json.imgUrl;
    alert("✅上传成功");
  }else{
    alert("上传失败："+json.msg);
  }
}

async function loadConfig(){
  const res = await fetch(`${API}/getConfig`);
  const cfg = await res.json();
  document.getElementById("siteName").value = cfg.siteName;
  document.getElementById("sitePhone").value = cfg.phone;
  document.getElementById("bannerArea").value = JSON.stringify(cfg.banner,null,2);
  document.getElementById("caseArea").value = JSON.stringify(cfg.caseList,null,2);
  document.getElementById("packageArea").value = JSON.stringify(cfg.packageList,null,2);
}

async function saveConfig(){
  const payload = {
    siteName: document.getElementById("siteName").value,
    phone: document.getElementById("sitePhone").value,
    banner: JSON.parse(document.getElementById("bannerArea").value),
    caseList: JSON.parse(document.getElementById("caseArea").value),
    packageList: JSON.parse(document.getElementById("packageArea").value)
  }
  const res = await fetch(`${API}/saveConfig`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${token}`
    },
    body:JSON.stringify(payload)
  })
  const json = await res.json();
  if(json.ok) alert("✅保存成功，前台同步更新！");
  else alert("保存失败："+json.msg);
}

function logout(){
  localStorage.removeItem("adminToken");
  token = null;
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("mainBox").classList.add("hidden");
}
</script>
</body>
</html>
