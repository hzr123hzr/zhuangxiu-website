<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台｜潮悦设计事务所</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{padding:24px;background:#f3f4f6;max-width:900px;margin:0 auto}
.box{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px #00000010}
h2{margin-bottom:16px;color:#222}
label{display:block;margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
textarea{min-height:80px}
button{padding:10px 20px;background:#c89b67;color:#fff;border:none;border-radius:6px;margin-top:10px;cursor:pointer}
.tip{color:green;margin:10px 0}
</style>
</head>
<body>
<h1>潮悦设计事务所后台管理</h1>
<div class="box">
  <h2>基础信息</h2>
  <label>联系电话</label>
  <input id="tel">
  <label>门店地址</label>
  <input id="addr">
  <button onclick="saveBase()">保存基础信息</button>
  <div class="tip" id="tipBase"></div>
</div>
<div class="box">
  <h2>说明</h2>
  <p>⚠️ 这个静态后台仅用于本地修改代码，改完需要重新上传整套文件到Cloudflare。</p>
  <p>想要在线直接保存、不用重新上传，后面再加后端。</p>
  <br>
  <a href="index.html">👉 回到前台首页</a>
</div>
<script>
document.getElementById('tel').value = SITE_CONFIG.base.tel;
document.getElementById('addr').value = SITE_CONFIG.base.addr;

function saveBase(){
  document.getElementById('tipBase').innerText = "提示：静态站无法直接在线保存，修改config.js文件后重新上传！";
}
</script>
</body>
</html>
