<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璟象装饰｜内容管理</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:20px auto;padding:0 16px;background:#f5f7fa}
.box{background:#fff;padding:20px;border-radius:10px;margin-bottom:16px}
h3{margin:0 0 12px 0;border-left:4px solid #2b549c;padding-left:8px}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px}
button{padding:10px 16px;border:none;border-radius:6px;background:#2563eb;color:white;margin:4px;cursor:pointer}
.btn-success{background:#16a34a}
.upload-area{border:2px dashed #ccc;padding:16px;text-align:center;border-radius:8px}
.img-preview{max-width:260px;margin-top:8px;border-radius:6px}
</style>
</head>
<body>
<div class="box">
  <h3>图片上传</h3>
  <div class="upload-area">
    <input type="file" id="imgInput" accept="image/*">
  </div>
  <input id="imgOut" readonly placeholder="图片链接">
  <img class="img-preview" id="imgPreview">
</div>

<div class="box">
  <h3>基础信息</h3>
  <input id="siteName" placeholder="公司名称" value="璟象装饰">
  <input id="sitePhone" placeholder="联系电话" value="13800000000">
  <textarea id="siteDesc" rows="4" placeholder="公司简介">专注家装、旧房改造、全屋整装，设计施工一体化，透明装修</textarea>
</div>

<div class="box">
  <h3>Banner轮播</h3>
  <textarea id="bannerTxt" rows="5">[
{"title":"匠心整装，品质家装","img":""}
]</textarea>
</div>

<div class="box">
  <h3>装修案例</h3>
  <textarea id="caseTxt" rows="6">[
{"title":"现代简约三房","desc":"120㎡现代简约","img":""}
]</textarea>
</div>

<div class="box">
  <h3>整装套餐</h3>
  <textarea id="pkgTxt" rows="6">[
{"title":"刚需整装套餐","price":"899元/㎡","desc":"基础硬装、水电、墙地砖"}
]</textarea>
</div>

<div class="box">
  <button onclick="loadLocal()">读取缓存</button>
  <button onclick="saveLocal()">临时保存</button>
  <button class="btn-success" onclick="downloadConfig()">导出 config.json</button>
</div>

<script>
// 图片转base64
const imgInput = document.getElementById('imgInput');
imgInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ev=>{
    document.getElementById('imgOut').value = ev.target.result;
    document.getElementById('imgPreview').src = ev.target.result;
  }
  r.readAsDataURL(file);
}

function getData(){
  return {
    siteName: document.getElementById('siteName').value,
    sitePhone: document.getElementById('sitePhone').value,
    siteDesc: document.getElementById('siteDesc').value,
    banner: JSON.parse(document.getElementById('bannerTxt').value),
    caseList: JSON.parse(document.getElementById('caseTxt').value),
    packageList: JSON.parse(document.getElementById('pkgTxt').value)
  }
}
function setData(d){
  document.getElementById('siteName').value = d.siteName;
  document.getElementById('sitePhone').value = d.sitePhone;
  document.getElementById('siteDesc').value = d.siteDesc;
  document.getElementById('bannerTxt').value = JSON.stringify(d.banner,null,2);
  document.getElementById('caseTxt').value = JSON.stringify(d.caseList,null,2);
  document.getElementById('pkgTxt').value = JSON.stringify(d.packageList,null,2);
}
function saveLocal(){
  localStorage.setItem('cfg',JSON.stringify(getData()));
  alert("临时保存到浏览器");
}
function loadLocal(){
  const raw = localStorage.getItem('cfg');
  if(raw) setData(JSON.parse(raw));
  alert(raw ? "读取成功" : "无缓存");
}
function downloadConfig(){
  const blob = new Blob([JSON.stringify(getData(),null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "config.json";
  a.click();
  alert("✅ 下载config.json！上传到github仓库即可更新网站！");
}
</script>
</body>
</html>
